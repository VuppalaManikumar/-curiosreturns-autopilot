name: 24/7 CuriosReturns Cloud Autopilot (10 Videos Daily)

on:
  schedule:
    # 10 Daily Videos in Indian Standard Time (IST = UTC + 5:30)
    # 1. 07:30 IST -> 02:00 UTC
    - cron: '0 2 * * *'
    # 2. 09:00 IST -> 03:30 UTC
    - cron: '30 3 * * *'
    # 3. 10:45 IST -> 05:15 UTC
    - cron: '15 5 * * *'
    # 4. 12:30 IST -> 07:00 UTC
    - cron: '0 7 * * *'
    # 5. 14:15 IST -> 08:45 UTC
    - cron: '45 8 * * *'
    # 6. 16:00 IST -> 10:30 UTC
    - cron: '30 10 * * *'
    # 7. 17:45 IST -> 12:15 UTC
    - cron: '15 12 * * *'
    # 8. 19:30 IST -> 14:00 UTC
    - cron: '0 14 * * *'
    # 9. 21:15 IST -> 15:45 UTC
    - cron: '45 15 * * *'
    # 10. 23:00 IST -> 17:30 UTC
    - cron: '30 17 * * *'

  workflow_dispatch:
    inputs:
      force_niche:
        description: 'Optional content niche override (leave blank for dynamic style)'
        required: false
        default: ''

jobs:
  post_viral_reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish Viral Reel to Instagram & Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '1334627683077843' }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841467777191474' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.META_ACCESS_TOKEN }}
          BRAND_NAME: ${{ secrets.BRAND_NAME || '@curiosreturns' }}
        run: |
          python main.py

      - name: Upload Generated Reel as GitHub Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: created-reels
          path: outputs/
          retention-days: 7
